[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wg-finanztracker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "flask>=3.1.3",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "interrogate>=1.7.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wg_finanztracker"]

[tool.mypy]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "pytesseract"
ignore_missing_imports = true
# pytesseract doesn't provide type subs / py.typed, so we ignore missing imports for it

[tool.interrogate]
fail-under = 20