<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>WG Finanztracker - Mitglied bearbeiten</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container"><a class="navbar-brand" href="/index">WG Finanztracker</a>
                <div class="navbar-nav"><a class="nav-link" href="/index">Start</a><a class="nav-link active" href="/members">Mitglieder</a><a class="nav-link" href="/receipts">Kassenbons</a><a class="nav-link" href="/statistics">Statistiken</a></div>
            </div>
        </nav>
        <main class="container py-5">
            <h1 class="mb-4">Mitglied bearbeiten</h1> {% if error %} <div class="alert alert-danger" role="alert">
                {{ error }}
            </div> {% endif %} <form action="/members/{{ member.id }}/edit" method="post">
                <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" id="name" name="name" class="form-control" value="{{ member.name }}" required></div><button type="submit" class="btn btn-primary"> Speichern </button><a href="/members" class="btn btn-secondary"> Abbrechen </a>
            </form>
        </main>
    </body>
</html>
