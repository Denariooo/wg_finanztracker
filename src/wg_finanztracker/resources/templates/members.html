<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>WG Finanztracker - Mitglieder</title>
        <link href="../static/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container"><a class="navbar-brand" href="/index">WG Finanztracker</a>
                <div class="navbar-nav"><a class="nav-link" href="/index"> Start </a><a class="nav-link active" href="/members">Mitglieder</a><a class="nav-link" href="/receipts">Kassenbons</a><a class="nav-link" href="/statistics">Statistiken</a></div>
            </div>
        </nav>
        <main class="container py-5">
            <h1 class="mb-4">WG-Mitglieder</h1> {% if error %} <div class="alert alert-danger" role="alert">
                {{ error }}
            </div> {% endif %} <h2 class="mb-3">Mitglied hinzufügen</h2>
            <form action="/members/create" method="post">
                <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" id="name" name="name" class="form-control" placeholder="Name des Mitglieds" required></div><button type="submit" class="btn btn-primary">Hinzufügen</button>
            </form>
            <hr class="my-4">
            <h2 class="mb-3">Mitglieder</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody> {% for member in members %} <tr>
                        <td>{{ member.name }}</td>
                        <td><a href="/members/{{ member.id }}/edit" class="btn btn-warning btn-sm">Bearbeiten</a>
                            <form action="/members/{{ member.id }}/delete" method="post" class="d-inline"><button type="submit" class="btn btn-danger btn-sm">Löschen</button></form>
                        </td>
                    </tr> {% endfor %} </tbody>
            </table><a href="/index" class="btn btn-secondary mt-3">Zurück</a>
        </main>
    </body>
</html>
